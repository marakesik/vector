<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VECTOR — криптотерминал</title><meta name="description" content="Демонстрационный терминал криптовалютного рынка">
<style>
:root{color-scheme:dark;--bg:#0c1014;--panel:#141a20;--line:#29343c;--ink:#e9f2f6;--muted:#a0afb8;--lime:#c8fa76;--red:#ff9199}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}header,footer{border-bottom:1px solid var(--line);background:#11171c}header>div,main,footer>div{width:min(1180px,calc(100% - 36px));margin:auto}header>div,footer>div,.bar,.chart-head,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header>div{min-height:69px;padding:12px 0}a{color:inherit;text-decoration:none}.brand{display:flex;gap:10px;align-items:center;font:800 21px system-ui;letter-spacing:.13em}.logo{color:#10170a;background:var(--lime);width:33px;height:33px;display:grid;place-items:center;border-radius:7px;letter-spacing:0}nav,.group{display:flex;gap:6px;flex-wrap:wrap}nav a,button,.button,select,input{font:inherit;color:inherit;border:1px solid var(--line);background:#182027;border-radius:7px;padding:8px 12px}nav a{border-color:transparent;background:none}nav a[aria-current=page],button[aria-pressed=true],.primary{background:var(--lime);color:#131d0a;border-color:var(--lime);font-weight:700}button,.button{cursor:pointer}a:hover,button:hover{border-color:var(--lime);color:var(--lime)}nav a[aria-current=page]:hover,.primary:hover,button[aria-pressed=true]:hover{color:#131d0a}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.mono,.tag,.price,th{font-family:ui-monospace,Consolas,monospace}.tag{color:var(--lime);letter-spacing:.11em;font-size:12px}.status{padding:5px 10px;border:1px solid #47583e;border-radius:99px;color:var(--lime);white-space:nowrap;font-size:12px}.status:before{content:'● ';font-size:9px}main{padding:32px 0 52px;min-height:75vh}.intro{margin-bottom:22px}.intro h1{font-size:clamp(2rem,5vw,4rem);letter-spacing:-.055em;line-height:1.03;margin:7px 0 10px}.muted,.intro p,small{color:var(--muted)}.intro p{margin:0}.metrics,.layout{display:grid;gap:14px;margin-bottom:14px}.metrics{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:2fr 1fr}.panel,.metric{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:18px;min-width:0}.metric strong{display:block;font:700 clamp(17px,3vw,25px) ui-monospace,Consolas,monospace;margin-top:6px}.panel h2{margin:0 0 10px;font-size:19px}.price{font-size:clamp(22px,4vw,37px);letter-spacing:-.05em;font-weight:700}.up{color:var(--lime)}.down{color:var(--red)}.chart{width:100%;display:block;height:auto;margin-top:10px}.grid{stroke:#334047;stroke-dasharray:4 5}.curve{fill:none;stroke:var(--lime);stroke-width:2.3;vector-effect:non-scaling-stroke}.axis{font:11px ui-monospace,monospace;fill:var(--muted)}.quote{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.quote:hover{color:var(--lime)}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:540px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted)}td a{font-weight:700}td a:hover{text-decoration:underline}.star{min-width:42px;padding:5px 9px}.asset-title{display:flex;align-items:center;gap:8px}.badge{display:inline-grid;place-items:center;width:30px;height:30px;background:#222d35;border-radius:7px;color:var(--lime);font-weight:800}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.fields label{display:grid;gap:5px}.fields input,.fields select{width:100%}.empty{padding:28px 0;color:var(--muted)}footer{border-top:1px solid var(--line);border-bottom:0}footer>div{padding:16px 0;color:var(--muted);font-size:13px}.view{animation:enter .2s ease-out}@keyframes enter{from{opacity:.55;transform:translateY(4px)}}@media(prefers-reduced-motion:reduce){.view{animation:none}}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel,.metric{padding:13px}nav{order:3;width:100%}nav a{padding:6px 8px}.metrics{gap:7px}}@media(max-width:380px){.metrics{grid-template-columns:1fr}}
</style></head><body>
<header><div><a class="brand" href="#overview"><span class="logo">V</span>VECTOR</a><nav aria-label="Разделы"><a href="#overview">Обзор</a><a href="#market">Рынок</a><a href="#watch">Избранное <span id="count"></span></a><a href="#converter">Конвертер</a></nav><span class="status">ДЕМО-РЕЖИМ</span></div></header>
<main id="main"></main><footer><div><span>VECTOR / 01</span><span>Котировки и графики смоделированы</span><a href="#about">О данных ↗</a></div></footer>
<script>
const coins=[
{symbol:"BTC",name:"Bitcoin",price:67482.36,change:2.41,volume:28.6,icon:"₿"},
{symbol:"ETH",name:"Ethereum",price:3521.84,change:1.18,volume:16.4,icon:"Ξ"},
{symbol:"SOL",name:"Solana",price:156.28,change:5.62,volume:3.8,icon:"≋"},
{symbol:"BNB",name:"BNB",price:602.18,change:-.76,volume:1.9,icon:"◆"},
{symbol:"XRP",name:"XRP",price:.5241,change:-1.42,volume:1.3,icon:"×"},
{symbol:"AVAX",name:"Avalanche",price:36.42,change:3.25,volume:.7,icon:"▲"},
{symbol:"LINK",name:"Chainlink",price:17.06,change:-.38,volume:.48,icon:"⬡"}
];
const main=document.querySelector("#main");
const storageKey="vector-demo-watch-v1";
let watch=new Set();
try{const saved=JSON.parse(localStorage.getItem(storageKey)||"[]");if(Array.isArray(saved))watch=new Set(saved.filter(value=>coins.some(coin=>coin.symbol===value)))}catch{}
let range="7Д",sort="volume",filter="all",query="",step=0,paused=false;
const money=new Intl.NumberFormat("ru-RU",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:4});
const format=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:8});
const quote=coin=>coin.price*(1+Math.sin(step/4+coins.indexOf(coin))*step/(1000*(step+10)));
const price=coin=>money.format(step?quote(coin):coin.price);
const trend=coin=>'<span class="'+(coin.change>=0?"up":"down")+'">'+(coin.change>=0?"+":"")+format.format(coin.change)+' %</span>';
function intro(code,title,description){return '<div class="intro"><div class="tag">'+code+'</div><h1>'+title+'</h1><p>'+description+'</p></div>'}
function star(coin){const active=watch.has(coin.symbol);return '<button class="star" type="button" data-star="'+coin.symbol+'" aria-label="Избранное '+coin.symbol+'" aria-pressed="'+active+'">'+(active?"★":"☆")+'</button>'}
function updateStars(){document.querySelector("#count").textContent=watch.size?"· "+watch.size:"";for(const el of main.querySelectorAll("[data-star]")){const active=watch.has(el.dataset.star);el.textContent=active?"★":"☆";el.setAttribute("aria-pressed",active)}}
function table(list){if(!list.length)return '<p class="empty">В этом списке пока нет активов.</p>';return '<div class="wrap"><table><thead><tr><th>Актив</th><th>Цена</th><th>24 ч</th><th>Объём</th><th>Список</th></tr></thead><tbody>'+list.map(coin=>'<tr><td><a class="asset-title" href="#asset/'+coin.symbol+'"><span class="badge">'+coin.icon+'</span>'+coin.symbol+' <small>'+coin.name+'</small></a></td><td class="mono" data-price="'+coin.symbol+'">'+price(coin)+'</td><td>'+trend(coin)+'</td><td class="mono">$'+format.format(coin.volume)+' млрд</td><td>'+star(coin)+'</td></tr>').join("")+'</tbody></table></div>'}
function graph(coin){
 const idx=coins.indexOf(coin), period=["24Ч","7Д","30Д","90Д"].indexOf(range);
 const pts=Array.from({length:52},(_,i)=>[48+i*10.1,135-i*(.55+period*.23)*(coin.change>=0?1:-.4)+Math.sin(i*.37+idx+period)*16+Math.cos(i*1.82+idx)*8]);
 const line=pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
 const last=pts.at(-1);
 return '<svg class="chart" viewBox="0 0 590 215" role="img" aria-label="Демонстрационный график '+coin.symbol+' за '+range+'"><defs><linearGradient id="shade" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#c8fa76" stop-opacity=".23"/><stop offset="1" stop-color="#c8fa76" stop-opacity="0"/></linearGradient></defs>'+[30,70,110,150,190].map(y=>'<path class="grid" d="M48 '+y+'H565"/>').join("")+'<text class="axis" x="48" y="207">Начало</text><text class="axis" x="522" y="207">Сейчас</text><polygon fill="url(#shade)" points="48,190 '+line+' '+last[0]+',190"/><polyline class="curve" points="'+line+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" fill="#c8fa76"/></svg>'
}
function chart(coin){return '<section class="panel"><div class="chart-head"><div><div class="tag">'+coin.symbol+' / USD</div><div class="price" data-price="'+coin.symbol+'">'+price(coin)+'</div>'+trend(coin)+'</div><div class="group" aria-label="Период графика">'+["24Ч","7Д","30Д","90Д"].map(r=>'<button data-range="'+r+'" aria-pressed="'+(range===r)+'">'+r+'</button>').join("")+'</div></div><div id="plot" data-coin="'+coin.symbol+'">'+graph(coin)+'</div></section>'}
function side(){return '<section class="panel"><h2>Активы</h2>'+coins.slice(0,5).map(coin=>'<a class="quote" href="#asset/'+coin.symbol+'"><span>'+coin.symbol+' <small>'+coin.name+'</small></span>'+trend(coin)+'</a>').join("")+'<a class="button" href="#market">Весь рынок →</a></section>'}
function overview(){return intro("01 / ОБЗОР","Рынок в движении","Панель наблюдения за криптовалютами с синтетическими котировками.")+'<div class="metrics"><div class="metric"><small>Активы на экране</small><strong>07</strong></div><div class="metric"><small>Объём за 24 ч</small><strong>$53,18 млрд</strong></div><div class="metric"><small>Растут / падают</small><strong><span class="up">4</span> / <span class="down">3</span></strong></div></div><div class="layout">'+chart(coins[0])+side()+'</div><div class="actions"><button id="pause" aria-pressed="'+paused+'">'+(paused?"Продолжить симуляцию":"Пауза симуляции")+'</button><a class="button" href="#converter">Рассчитать сумму →</a></div>'}
function marketList(){return coins.filter(c=>(c.symbol+" "+c.name).toLowerCase().includes(query.trim().toLowerCase())&&(filter==="all"||(filter==="up"?c.change>0:c.change<0))).sort((a,b)=>b[sort]-a[sort])}
function market(){return intro("02 / РЫНОК","Список активов","Найдите монету, отсортируйте список или откройте её график.")+'<section class="panel"><div class="bar"><input id="search" type="search" placeholder="BTC или Bitcoin" aria-label="Поиск актива"><div class="group" aria-label="Фильтр">'+[["all","Все"],["up","Растут"],["down","Падают"]].map(([key,label])=>'<button data-filter="'+key+'" aria-pressed="'+(key===filter)+'">'+label+'</button>').join("")+'</div><label>Сортировка <select id="sort"><option value="volume">Объём</option><option value="price">Цена</option><option value="change">Изменение</option></select></label></div><div id="results">'+table(marketList())+'</div></section>'}
function favorites(){return intro("03 / ИЗБРАННОЕ","Список наблюдения","Звёздочка добавляет актив в список. Список сохраняется в этом браузере.")+'<section class="panel">'+table(coins.filter(c=>watch.has(c.symbol)))+'<p><a class="button" href="#market">Добавить активы →</a></p></section>'}
function asset(coin){return '<p><a href="#market">← Все активы</a></p>'+intro("АКТИВ / "+coin.symbol,coin.name,"Обзор пары "+coin.symbol+" / USD.")+'<div class="layout">'+chart(coin)+'<section class="panel"><h2>Действия</h2><div class="group">'+star(coin)+'<a class="button" href="#watch">Список наблюдения</a><a class="button" href="#converter/'+coin.symbol+'">Конвертировать</a></div><p class="muted">Суточный объём · $'+format.format(coin.volume)+' млрд</p></section></div>'}
const options=()=>'<option value="USD">USD</option>'+coins.map(c=>'<option value="'+c.symbol+'">'+c.symbol+' · '+c.name+'</option>').join("");
function converter(){return intro("04 / КОНВЕРТЕР","Калькулятор курса","Сравните суммы в долларах и криптовалютах по демонстрационным ценам.")+'<section class="panel"><label>Сумма <input id="amount" type="number" min="0" step="any" value="1"></label><div class="fields"><label>Из <select id="from">'+options()+'</select></label><label>В <select id="to">'+options()+'</select></label></div><button id="swap">⇄ Поменять местами</button><p><output class="price" id="converted" aria-live="polite"></output></p></section>'}
function calculate(){const amount=main.querySelector("#amount");if(!amount)return;const value=amount.valueAsNumber;const rate=id=>{const c=coins.find(x=>x.symbol===id);return c?quote(c):1};const from=main.querySelector("#from").value,to=main.querySelector("#to").value;const result=value*rate(from)/rate(to);main.querySelector("#converted").textContent=Number.isFinite(result)&&value>=0?format.format(result)+" "+to:"Введите неотрицательную сумму"}
function route(){
 const [page,param]=location.hash.slice(1).split("/");const coin=coins.find(c=>c.symbol===param);
 for(const link of document.querySelectorAll("nav a")){if(link.hash==="#"+(page==="asset"?"market":page||"overview"))link.setAttribute("aria-current","page");else link.removeAttribute("aria-current")}
 const views={overview,market,watch:favorites,converter,about:()=>intro("СПРАВКА / 05","О данных","VECTOR — интерактивная демонстрация. Цены, объёмы и графики синтетические. Обновление на экране имитирует движение рынка.")};
 const view=page==="asset"&&coin?asset(coin):Object.hasOwn(views,page)?views[page]():overview();
 main.innerHTML='<div class="view">'+view+'</div>';
 if(page==="market"){main.querySelector("#search").value=query;main.querySelector("#sort").value=sort}
 if(page==="converter"){main.querySelector("#from").value=coin?.symbol||"BTC";main.querySelector("#to").value="USD";calculate()}
 updateStars();
}
function refreshMarket(){const results=main.querySelector("#results");if(results)results.innerHTML=table(marketList())}
main.addEventListener("click",event=>{
 const button=event.target.closest("button");if(!button)return;
 if(button.dataset.star){const symbol=button.dataset.star;if(watch.has(symbol))watch.delete(symbol);else watch.add(symbol);try{localStorage.setItem(storageKey,JSON.stringify([...watch]))}catch{}if(location.hash==="#watch"){route();main.querySelector("[data-star], a.button")?.focus()}else updateStars()}
 if(button.dataset.range){range=button.dataset.range;for(const b of main.querySelectorAll("[data-range]"))b.setAttribute("aria-pressed",b===button);const plot=main.querySelector("#plot");plot.innerHTML=graph(coins.find(c=>c.symbol===plot.dataset.coin))}
 if(button.dataset.filter){filter=button.dataset.filter;for(const b of main.querySelectorAll("[data-filter]"))b.setAttribute("aria-pressed",b===button);refreshMarket()}
 if(button.id==="pause"){paused=!paused;button.textContent=paused?"Продолжить симуляцию":"Пауза симуляции";button.setAttribute("aria-pressed",paused)}
 if(button.id==="swap"){const a=main.querySelector("#from"),b=main.querySelector("#to");[a.value,b.value]=[b.value,a.value];calculate()}
});
main.addEventListener("input",event=>{if(event.target.id==="search"){query=event.target.value;refreshMarket()}if(event.target.id==="amount")calculate()});
main.addEventListener("change",event=>{if(event.target.id==="sort"){sort=event.target.value;refreshMarket()}if(["from","to"].includes(event.target.id))calculate()});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
setInterval(()=>{if(paused)return;step++;for(const cell of main.querySelectorAll("[data-price]"))cell.textContent=price(coins.find(c=>c.symbol===cell.dataset.price));const output=main.querySelector("#converted");if(output){output.setAttribute("aria-live","off");calculate();output.setAttribute("aria-live","polite")}},3500);
</script></body></html>
